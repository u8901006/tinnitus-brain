name: Tinnitus Daily Report

on:
  schedule:
    - cron: "45 0 * * *" # UTC 00:45 = 台北時間 08:45
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine date
        id: date
        run: |
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            echo "target=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi

      - name: Check existing reports
        id: existing
        run: |
          TARGET="${{ steps.date.outputs.target }}"
          if [ -f "docs/tinnitus-${TARGET}.html" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Report for $TARGET already exists, will skip if no new data"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch papers from PubMed
        run: |
          python scripts/fetch_papers.py \
            --days 7 \
            --max-papers 50 \
            --json \
            --output papers.json
        continue-on-error: true

      - name: Check papers data
        id: papers
        run: |
          TARGET="${{ steps.date.outputs.target }}"
          if [ -f papers.json ] && grep -q '"count"' papers.json; then
            COUNT=$(python -c "import json; print(json.load(open('papers.json')).get('count',0))")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Papers found: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo "No new papers, checking if report already exists..."
              if [ "${{ steps.existing.outputs.exists }}" = "true" ]; then
                echo "Report exists and no new papers, skipping generation"
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "{\"date\":\"${TARGET}\",\"count\":0,\"papers\":[]}" > papers.json
          fi

      - name: Generate report with Zhipu AI
        if: steps.papers.outputs.skip != 'true'
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_API_BASE: ${{ vars.ZHIPU_API_BASE }}
          ZHIPU_MODEL: ${{ vars.ZHIPU_MODEL }}
        run: |
          python scripts/generate_report.py \
            --input papers.json \
            --output "docs/tinnitus-${{ steps.date.outputs.target }}.html" \
            --api-key "$ZHIPU_API_KEY"

      - name: Generate index page
        if: steps.papers.outputs.skip != 'true'
        run: python scripts/generate_index.py

      - name: Commit and push
        if: steps.papers.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "👂 tinnitus daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        if: always()
        run: |
          TARGET="${{ steps.date.outputs.target }}"
          echo "### 👂 Tinnitus Daily Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "**Papers analyzed:** ${{ steps.papers.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Skipped:** ${{ steps.papers.outputs.skip }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report:** [tinnitus-${TARGET}.html](https://u8901006.github.io/tinnitus-brain/tinnitus-${TARGET}.html)" >> "$GITHUB_STEP_SUMMARY"
